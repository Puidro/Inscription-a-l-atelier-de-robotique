<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment faire un formulaire</title>
</head>
<body>
    <form method="post">
                <p>Niveau :</p>

        <input type="radio" id="deb" name="niveau"
            value="debutant" checked>
        <label for="deb">Débutant</label>

        <input type="radio" id="conf" name="niveau"
            value="confirme">
        <label for="conf">Confirmé</label>
        <br><br>
        <p>Centres d’intérêt :</p>

        <input type="checkbox" id="c1"
            name="interet" value="Scroll" checked>
        <label for="c1">Scroll</label>

        <input type="checkbox" id="c2"
            name="interet" value="Footbaall" checked>
        <label for="c2">Footbaall</label>

        <input type="checkbox" id="c3"
            name="interet" value="jeux">
        <label for="c3">Jeux vidéo</label>
        <br><br>

        <label for="ville">Ville</label>
        <select name="ville" id="ville">
            <option value="">----Choisir---</option>
            <option value="Rabat" selected>Rabat</option>
            <option value="Marrakech"selected>Marrakech</option>
            <option value="Agadir"selected>Agadir</option>
            <option value="Fes"selected>Fes</option>
            <option value="Meknes"selected>Meknes</option>
            <option value="Tamesna"selected>Tamesna</option>
        </select>
        <br><br>

        <label for="Msg">Votre message </label><br>
        <textarea name="message" id="Msg"rows="4" cols="30" placeholder="Ecrire ici... "></textarea>
        <br><br>

        <label for="cp">Code postal</label>
        <input type="number" id="cp" name="cp" pattern="[0-9]{5}" title="5 chiffres, par exemple 10000">
       <br><br>

   <fieldset>
        <legend>Coordonnées</legend>

        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" required>

        <br><br>

        <label for="tel">Téléphone :</label>
        <input type="tel" id="tel" name="tel" required>

    </fieldset>
    <br><br>
        
        <label for="poids">votre poids en cm </label>
        <input type="number" id="poids" name="poids" min="40" max="90" required>
        <br><br>

        <label for="Age">votre age</label>
        <input type="number" name="Age" id="Age" min="18" max="30" step="1">
        <br><br>

        <label for="nom">Nom :</label>
        <input type="text" id="nom" name="nom" placeholder="EX. Amine" maxlength="10" minlength="2" required >
        <br><br>

        <label for="prenom">Prenom:</label>
        <input type="text" id="prenom" name="prenom" placeholder="EX. BENJHOUD"required >
        <br><br>

        <label for="Email">Email:</label>
        <input type="Email" id="Email" name="Email" placeholder="BadrBen@gmail.com" autofocus required>

        <br><br>
        <label for="tel">tele:</label>
        <input type="tel" id="tele" name="tele" value="+212" maxlength="14" placeholder="+212600000000" required>
    
        <br><br>

        <label for="Date naissance">Date naissance :</label>
        <input type="date" id="Date naissance " name="Date naissance" required  min="18" max="30">
        
        <br><br>          
        
        <label for="mot passe">Mot passe:</label>
        <input type="password" id="mot passe" name="mot passe" required >
        <br><br>
       
        <button type="submit">Envoyer</button>
        
    </form>




</body>
</html>
